[server]
headless = true
port = 8501

[theme]
primaryColor      = "#00d4ff"       # cyan — primary accent, buttons, links
backgroundColor   = "#0a0e1a"       # deep space black-blue
secondaryBackgroundColor = "#0f1629" # slightly lighter panels / cards
textColor         = "#c8d8e8"       # cool off-white — easy on dark bg
font              = "monospace"

[browser]
gatherUsageStats = false
